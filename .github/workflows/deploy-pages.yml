name: Pubblica il diario della tesi

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5

      - name: Genera il sito
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site
          future: true

      - name: Verifica le pagine prima della pubblicazione
        shell: bash
        run: |
          for page in index.html piano-tesi-new/index.html settimane/index.html assets/css/styles.css; do
            if [ ! -s "_site/$page" ]; then
              echo "::error::File mancante o vuoto nel sito generato: $page"
              exit 1
            fi
          done

      - name: Carica il sito
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v4
